<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="轻量、离线优先的减脂饮食与运动记录工具">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>豆记录 · 减脂记录</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">今天</p>
        <h1>豆记录</h1>
      </div>
      <div class="top-actions">
        <label class="profile-picker" aria-label="当前用户">
          <span class="sr-only">当前用户</span>
          <select id="profileSelect"></select>
        </label>
        <button class="icon-button" id="addProfileButton" type="button" aria-label="添加用户">＋</button>
      </div>
    </header>

    <main id="mainContent">
      <section class="page active" id="todayPage" data-page="today">
        <div id="todayContent"></div>
      </section>

      <section class="page" id="logPage" data-page="log" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">流水</p>
            <h2>每日记录</h2>
          </div>
          <label class="date-control">日期<input type="date" id="logDate"></label>
        </div>
        <div id="logSummary"></div>
        <div id="entryList"></div>
      </section>

      <section class="page" id="trendPage" data-page="trend" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">趋势</p>
            <h2>看平均，不追单日</h2>
          </div>
          <select id="rangeSelect" class="compact-select" aria-label="趋势时间范围">
            <option value="7">近 7 天</option>
            <option value="30" selected>近 30 天</option>
            <option value="90">近 90 天</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div id="customRange" class="form-grid" hidden>
          <label class="field"><span>开始日期</span><input type="date" id="rangeStart"></label>
          <label class="field"><span>结束日期</span><input type="date" id="rangeEnd"></label>
        </div>
        <div id="trendContent"></div>
      </section>

      <section class="page" id="settingsPage" data-page="settings" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">设置</p>
            <h2>个人与数据</h2>
          </div>
        </div>
        <div id="settingsContent"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-button active" type="button" data-target="today" aria-current="page">
        <span class="nav-icon">⌂</span><span>今天</span>
      </button>
      <button class="nav-button" type="button" data-target="log">
        <span class="nav-icon">≡</span><span>记录</span>
      </button>
      <button class="nav-button" type="button" data-target="trend">
        <span class="nav-icon">⌁</span><span>趋势</span>
      </button>
      <button class="nav-button" type="button" data-target="settings">
        <span class="nav-icon">⚙</span><span>设置</span>
      </button>
    </nav>
  </div>

  <dialog id="profileDialog" class="sheet-dialog">
    <form id="profileForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">个人档案</p><h2 id="profileDialogTitle">开始设置</h2></div>
        <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
      </div>
      <input type="hidden" name="profileId">
      <div class="form-grid">
        <label class="field full"><span>昵称</span><input name="name" required maxlength="20" placeholder="例如：我、小王"></label>
        <label class="field"><span>计算公式</span>
          <select name="formula">
            <option value="mifflin">Mifflin（推荐）</option>
            <option value="katch">Katch（需体脂率）</option>
          </select>
        </label>
        <label class="field"><span>公式性别常数</span>
          <select name="sex"><option value="male">男性常数</option><option value="female">女性常数</option></select>
        </label>
        <label class="field"><span>年龄（限成年人）</span><input name="age" type="number" min="18" max="100" required inputmode="numeric"></label>
        <label class="field"><span>身高（cm）</span><input name="height" type="number" min="120" max="230" step="0.1" required inputmode="decimal"></label>
        <label class="field"><span>当前体重（kg）</span><input name="weight" type="number" min="35" max="300" step="0.1" required inputmode="decimal"></label>
        <label class="field"><span>目标体重（kg）</span><input name="goalWeight" type="number" min="35" max="300" step="0.1" required inputmode="decimal"></label>
        <label class="field"><span>体脂率（可选，%）</span><input name="bodyFat" type="number" min="3" max="60" step="0.1" inputmode="decimal"></label>
        <label class="field"><span>每周减重速度</span>
          <select name="weeklyRate">
            <option value="0">维持体重</option>
            <option value="0.25">体重的 0.25%</option>
            <option value="0.5" selected>体重的 0.5%</option>
            <option value="0.75">体重的 0.75%</option>
            <option value="1">体重的 1.0%</option>
          </select>
        </label>
        <label class="field full"><span>日常活动（包含平时训练）</span>
          <select name="activity">
            <option value="1.2">久坐 · 几乎不运动</option>
            <option value="1.375">轻度 · 每周训练 1–3 次</option>
            <option value="1.55" selected>中等 · 每周训练 3–5 次</option>
            <option value="1.725">高 · 每周高强度训练 6–7 次</option>
          </select>
        </label>
        <label class="field full"><span>运动热量回补</span>
          <select name="exerciseBackfill">
            <option value="0">0% · 推荐，避免重复计算</option>
            <option value="0.25">25% · 超长训练日可用</option>
            <option value="0.5">50% · 高运动量时谨慎使用</option>
          </select>
          <small>活动系数已包含日常训练，默认不把运动热量重复加回。</small>
        </label>
      </div>
      <div id="profilePreview" class="formula-preview" aria-live="polite"></div>
      <div class="dialog-actions">
        <button type="button" class="button secondary close-dialog">取消</button>
        <button type="submit" class="button primary">保存档案</button>
      </div>
    </form>
  </dialog>

  <dialog id="foodDialog" class="sheet-dialog">
    <form id="foodForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">饮食</p><h2>添加食物</h2></div>
        <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <label class="field"><span>日期</span><input name="date" type="date" required></label>
        <label class="field"><span>餐次</span><select name="meal"><option>早餐</option><option selected>午餐</option><option>晚餐</option><option>加餐</option></select></label>
        <label class="field full"><span>搜索食物</span><input id="foodSearch" type="search" placeholder="输入鸡腿、牛肉、麦当劳…" autocomplete="off"></label>
      </div>
      <div id="foodPicker" class="picker-list" role="listbox" aria-label="选择食物"></div>
      <input type="hidden" name="foodId" required>
      <div id="selectedFood" class="selected-box muted-box">请选择食物</div>
      <div class="form-grid">
        <label class="field"><span>份数</span><input name="quantity" type="number" min="0.1" max="20" step="0.1" value="1" required inputmode="decimal"></label>
        <label class="field"><span>本次热量（kcal）</span><input name="calories" type="number" min="0" max="10000" step="1" required inputmode="numeric"></label>
        <label class="field full"><span>备注（可选）</span><input name="note" maxlength="80" placeholder="例如：少饭、去皮、包装标示值"></label>
      </div>
      <p class="help-text">餐馆菜品受油量和份量影响很大。若有包装或门店营养标示，请直接修改“本次热量”。</p>
      <div class="dialog-actions">
        <button type="button" class="button secondary" id="openCustomFood">＋ 自定义食物</button>
        <button type="submit" class="button primary">加入记录</button>
      </div>
    </form>
  </dialog>

  <dialog id="exerciseDialog" class="sheet-dialog">
    <form id="exerciseForm" method="dialog">
      <div class="dialog-head">
        <div><p class="eyebrow">运动</p><h2>记录消耗</h2></div>
        <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <label class="field"><span>日期</span><input name="date" type="date" required></label>
        <label class="field"><span>运动</span><select name="exerciseId" id="exerciseSelect"></select></label>
        <label class="field"><span>强度</span><select name="intensity" id="intensitySelect"><option value="low">低强度</option><option value="medium" selected>中强度</option><option value="high">高强度</option></select></label>
        <label class="field"><span>时长（分钟）</span><input name="minutes" type="number" min="1" max="600" value="45" required inputmode="numeric"></label>
      </div>
      <div id="intensityGuide" class="guide-box"></div>
      <label class="field"><span>估算消耗（kcal，可按手表修改）</span><input name="calories" type="number" min="1" max="5000" required inputmode="numeric"></label>
      <p class="help-text">使用 MET × 3.5 × 体重 ÷ 200 × 分钟估算。器械和手表也有误差，长期保持同一口径更有价值。</p>
      <div class="dialog-actions">
        <button type="button" class="button secondary" id="openCustomExercise">＋ 自定义运动</button>
        <button type="submit" class="button primary">加入记录</button>
      </div>
    </form>
  </dialog>

  <dialog id="weightDialog" class="small-dialog">
    <form id="weightForm" method="dialog">
      <div class="dialog-head"><h2>记录体重</h2><button class="icon-button close-dialog" type="button" aria-label="关闭">×</button></div>
      <label class="field"><span>日期</span><input name="date" type="date" required></label>
      <label class="field"><span>体重（kg）</span><input name="weight" type="number" min="30" max="300" step="0.1" required autofocus inputmode="decimal"></label>
      <div class="dialog-actions"><button type="submit" class="button primary">保存</button></div>
    </form>
  </dialog>

  <dialog id="customFoodDialog" class="small-dialog">
    <form id="customFoodForm" method="dialog">
      <div class="dialog-head"><h2>自定义食物</h2><button class="icon-button close-dialog" type="button" aria-label="关闭">×</button></div>
      <label class="field"><span>名称</span><input name="name" required maxlength="30"></label>
      <div class="form-grid">
        <label class="field"><span>每份热量（kcal）</span><input name="calories" type="number" min="0" max="5000" required></label>
        <label class="field"><span>单位</span><input name="unit" value="份" required maxlength="10"></label>
      </div>
      <label class="field"><span>说明（可选）</span><input name="note" maxlength="80" placeholder="例如：每份 250g"></label>
      <div class="dialog-actions"><button type="submit" class="button primary">保存并选择</button></div>
    </form>
  </dialog>

  <dialog id="customExerciseDialog" class="small-dialog">
    <form id="customExerciseForm" method="dialog">
      <div class="dialog-head"><h2>自定义运动</h2><button class="icon-button close-dialog" type="button" aria-label="关闭">×</button></div>
      <label class="field"><span>名称</span><input name="name" required maxlength="30"></label>
      <div class="form-grid three">
        <label class="field"><span>低强度 MET</span><input name="low" type="number" min="1" max="25" step="0.1" value="3" required></label>
        <label class="field"><span>中强度 MET</span><input name="medium" type="number" min="1" max="25" step="0.1" value="5" required></label>
        <label class="field"><span>高强度 MET</span><input name="high" type="number" min="1" max="25" step="0.1" value="7" required></label>
      </div>
      <label class="field"><span>强度判断说明</span><input name="guide" maxlength="120" placeholder="例如：低强度能轻松说话；高强度只能说短句"></label>
      <div class="dialog-actions"><button type="submit" class="button primary">保存并选择</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="small-dialog">
    <form method="dialog">
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmMessage" class="help-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button secondary">取消</button>
        <button value="confirm" class="button danger">确认</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importInput" type="file" accept="application/json" hidden>
  <script src="app.js" defer></script>
</body>
</html>
